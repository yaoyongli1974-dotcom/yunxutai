name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            database: mysql:8.4
          - php: '8.5'
            database: mysql:8.4
          - php: '8.4'
            database: mariadb:11
          - php: '8.5'
            database: mariadb:11
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: jidian_test
        ports: ['3306:3306']
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ""
      DB_DATABASE: jidian_test
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_KEY: ci-only-key-0123456789abcdef0123456789abcdef
      AI_ENABLED: "true"
      AI_PROVIDER: demo
      WX_APPID: ci-test-appid
      WX_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, gd, curl, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Wait for database (works for MySQL and MariaDB)
        run: |
          php -r '
          for ($i = 0; $i < 90; $i++) {
            try {
              new PDO("mysql:host=127.0.0.1;port=3306;dbname=jidian_test;charset=utf8mb4", "root", "", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
              echo "database ready\n";
              exit(0);
            } catch (Throwable $e) {
              sleep(1);
            }
          }
          fwrite(STDERR, "database not ready\n");
          exit(1);
          '

      - name: PHP syntax check
        run: find app bin database tests config public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Miniprogram JS syntax check
        run: find miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Static analysis (PHPStan level 5, baseline for legacy)
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/phpstan analyse --no-progress

      - name: Full integration suite (fresh DB + migrations + security tests)
        run: bash bin/test.sh

      - name: Migration status
        run: php bin/migrate-v2.php --status

      - name: Migration repeatability
        run: php bin/migrate-v2.php >/dev/null && php bin/migrate-v2.php --status

      - name: Doctor (production-like upload limits)
        run: php -d upload_max_filesize=20M -d post_max_size=25M bin/doctor.php

      - name: Secret scan (no credentials in tracked source)
        run: |
          ! git grep -nEi '(ghp_[A-Za-z0-9]{20,}|AKIA[A-Z0-9]{16}|sk-[A-Za-z0-9]{20,})' -- ':!.env.example'
          ! git grep -nE 'APP_KEY=.*[A-Za-z0-9]{32,}' -- .env.example
