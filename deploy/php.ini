; 云叙台 PHP 配置样例（PHP-FPM）
; 放到 /etc/php/8.4/fpm/conf.d/99-jingsi.ini 后重启 php-fpm。

expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/log/php/jingsi-error.log

upload_max_filesize = 52M
post_max_size = 56M
max_file_uploads = 10
max_execution_time = 60
memory_limit = 256M

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
session.gc_maxlifetime = 7200

; 生产环境不要开启 allow_url_include
allow_url_include = Off
