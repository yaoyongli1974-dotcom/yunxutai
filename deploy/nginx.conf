# 静思园 Nginx 样例
# 使用前替换 server_name、证书路径与 PHP-FPM socket。

server {
    listen 80;
    server_name memorial.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name memorial.example.com;

    root /srv/jidian/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/memorial.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memorial.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 52m;
    client_body_timeout 60s;

    # 禁止访问敏感路径（即使 root 配置错误也兜底）
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /app/ { deny all; }
    location ^~ /config/ { deny all; }
    location ^~ /database/ { deny all; }
    location ^~ /storage/ { deny all; }
    location ^~ /tests/ { deny all; }
    location ^~ /bin/ { deny all; }
    location ^~ /docs/ { deny all; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    location ~* \.(env|sql|log|md|sh)$ { deny all; }
}
