# 云叙台 Nginx 样例
# 使用前替换 server_name、证书路径与 PHP-FPM socket。

server {
    listen 80;
    server_name memorial.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name memorial.example.com;

    root /srv/jidian/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/memorial.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memorial.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP（边缘层可选示例，默认不启用）：应用已在 app/bootstrap.php 对所有 PHP 响应输出
    # Content-Security-Policy。Nginx 只需为绕过 PHP、由边缘直接返回的响应（如 /assets/ 静态
    # 文件、自定义错误页）补发该头。启用时必须与 app/bootstrap.php 中的应用值完全一致，
    # 且只作用于这些静态响应，避免同一响应出现重复或互相冲突的 CSP。
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # CSP 路线图（仅报告，默认不启用）：先观察、后收紧，细节见 docs/security.md。
    # 下面的示例比当前应用策略更严格（去掉 'unsafe-inline'、显式声明 connect-src /
    # frame-src / object-src 并加上 report-* 上报），只上报违规、不阻断任何请求。
    # 启用前必须把 report-uri / report-to / Report-To 的占位端点换成真实收集地址，
    # 观察一段时间、确认没有业务相关违规后，再把收紧后的值写入 app/bootstrap.php。
    # 不要在边缘再下发 enforcing 的 Content-Security-Policy：应用已发送一条，重复或
    # 冲突的头会被浏览器取交集，造成难以诊断的破坏；Report-Only 则可安全并存。
    # add_header Report-To '{"group":"csp","max_age":108864,"endpoints":[{"url":"https://csp.example.com/report"}]}' always;
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; report-uri /csp-report; report-to csp" always;

    client_max_body_size 52m;
    client_body_timeout 60s;

    # 禁止访问敏感路径（即使 root 配置错误也兜底）
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /app/ { deny all; }
    location ^~ /config/ { deny all; }
    location ^~ /database/ { deny all; }
    location ^~ /storage/ { deny all; }
    location ^~ /tests/ { deny all; }
    location ^~ /bin/ { deny all; }
    location ^~ /docs/ { deny all; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    location ~* \.(env|sql|log|md|sh)$ { deny all; }
}
